[project]
name = "receipt-extractor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.3",
    "google-genai>=2.29.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
